tonNode:
  enabled: true
  namespace: default
  name: tonnode
  image: ghcr.io/neodix42/mytonctrl:v1.0.5
  tonImage: ghcr.io/ton-blockchain/ton:v2026.10-amd64
  # Installation flags: validator mode, mainnet, and dump download.
  args:
    - -m
    - validator
    - -n
    - mainnet
    - -d
  replicas: 3
  storage:
    tonWorkSize: 700Gi
    # Retained legacy PVCs; MyTonCtrl now keeps state in ton-work/controller.
    tonSourceSize: 20Gi
    myTonCoreSize: 20Gi
    myTonCtrlSize: 20Gi
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 16000m
      memory: 64Gi
    limits:
      cpu: 128000m
      memory: 256Gi
  nodeSelector: {}
  network:
    validatorPort: 30001
    quicPort: 31001
    liteServerPort: 30003
    validatorConsolePort: 30002
    hostPortsEnabled: true
    publicIP: ""
  debug:
    holdOnFailure: false
    jemalloc:
      enabled: false
      # Average bytes between sampled allocations: 2^19 (512 KiB).
      sampleLog2: 19
      # Dump every 2^34 allocated bytes (16 GiB), not a time interval or live heap limit.
      intervalLog2: 34
      # Best-effort retention in /var/ton-work/diagnostics/jemalloc on the TON PVC.
      maxProfiles: 8
  keyManagement:
    enabled: true
    provider: vault
    credentialsSecretRef: ton-vault-creds
    vaultTransitKey: ton-validator
    kmsKeyID: ""
    kmsVendor: aws
    inMemory:
      keysSizeLimit: 128Mi
      walletsSizeLimit: 512Mi
      controllerSizeLimit: 512Mi
      keyringSizeLimit: 128Mi
      stagingSizeLimit: 2Gi
    encryptedBundle:
      pvcSize: 5Gi
      storageClassName: encrypted-sc
      accessModes:
        - ReadWriteOnce
      fileName: keys.bundle.enc
      metaFileName: keys.bundle.meta
    agent:
      image: ""
      resources: {}
  env:
    - name: ARCHIVE_TTL
      value: "86400"
    - name: STATE_TTL
      value: "86400"
    - name: VERBOSITY
      value: "1"
    - name: TELEMETRY
      value: "true"
    - name: DUMP_EXTRACT_THREADS
      value: "1"
    - name: CUSTOM_PARAMETERS
      value: "--exporter-address 0.0.0.0:9777"
