nameOverride: ""
fullnameOverride: ""

namespace:
  create: false

image:
  repository: ghcr.io/neodix42/ton-k8s-operator
  tag: 0.3.0
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 1

leaderElection:
  enabled: true

metrics:
  enabled: true
  service:
    port: 8443

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

extraArgs: []
extraEnv: []

tonNode:
  enabled: false
  name: tonnode
  namespace: ""
  labels: {}
  # MyTonCtrl runtime and the official TON binary exporter are versioned independently.
  image: ghcr.io/neodix42/mytonctrl:v1.0.0
  tonImage: ghcr.io/ton-blockchain/ton:v2026.08-amd64
  # Installation flags: mode, network, dump download, and relaxed minimum requirements.
  args:
    - -m
    - liteserver
    - -n
    - mainnet
    - -d
    - -i
  replicas: 3
  storage:
    tonWorkSize: 700Gi
    # Legacy PVCs remain declared to preserve existing StatefulSets and data.
    # New MyTonCtrl state lives in ton-work; exported binaries use an ephemeral volume.
    tonSourceSize: 20Gi
    myTonCoreSize: 20Gi
    myTonCtrlSize: 20Gi
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 16000m
      memory: 64Gi
    limits:
      cpu: 128000m
      memory: 256Gi
  nodeSelector: {}
  network:
    validatorPort: 30001
    quicPort: 31001
    liteServerPort: 30003
    validatorConsolePort: 30002
    hostPortsEnabled: true
    publicIP: ""
  configRefName: ""
  debug:
    holdOnFailure: false
  keyManagement:
    enabled: true
    provider: vault
    credentialsSecretRef: ton-vault-creds
    vaultTransitKey: ton-validator
    kmsKeyID: ""
    kmsVendor: aws
    inMemory:
      keysSizeLimit: 128Mi
      walletsSizeLimit: 512Mi
    encryptedBundle:
      pvcSize: 5Gi
      storageClassName: encrypted-sc
      accessModes:
        - ReadWriteOnce
      fileName: keys.bundle.enc
      metaFileName: keys.bundle.meta
    agent:
      # Empty inherits the MyTonCtrl runtime image above.
      image: ""
      resources: {}
  env:
    - name: ARCHIVE_TTL
      value: "86400"
    - name: STATE_TTL
      value: "86400"
    - name: VERBOSITY
      value: "1"
    - name: TELEMETRY
      value: "true"
    - name: CUSTOM_PARAMETERS
      value: ""
