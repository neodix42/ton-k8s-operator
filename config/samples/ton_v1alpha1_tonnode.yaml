apiVersion: ton.ton.org/v1alpha1
kind: TonNode
metadata:
  labels:
    app.kubernetes.io/name: ton-k8s-operator
    app.kubernetes.io/managed-by: kustomize
  name: tonnode
spec:
  image: ghcr.io/neodix42/mytonctrl:v1.0.0
  tonImage: ghcr.io/ton-blockchain/ton:v2026.08-amd64
  args: ["-m", "liteserver", "-n", "mainnet", "-d"]
  replicas: 3
  storage:
    tonWorkSize: 700Gi
    # Legacy claims are retained for existing StatefulSets.
    tonSourceSize: 20Gi
    myTonCoreSize: 20Gi
    myTonCtrlSize: 20Gi
  network:
    validatorPort: 30001
    quicPort: 31001
    liteServerPort: 30003
    validatorConsolePort: 30002
    hostPortsEnabled: true
  keyManagement:
    enabled: false
  debug:
    holdOnFailure: false
  env:
  - name: TELEMETRY
    value: "true"
